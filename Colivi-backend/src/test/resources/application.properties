# ============================================================
# Configuración exclusiva para la suite de pruebas
# Sobrescribe application.properties durante los tests.
# ============================================================

spring.application.name=Colivi-backend-test

# --- Base de datos en memoria H2 (sin necesidad de PostgreSQL) ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# --- Flyway desactivado en tests ---
# Los tests unitarios/slice usan H2 + create-drop.
# Las migraciones SQL (triggers, CREATE TYPE) usan sintaxis PostgreSQL exclusiva.
# Los tests de integración con Testcontainers gestionarán Flyway por su cuenta.
spring.flyway.enabled=false

# --- JWT: clave de 256 bits válida en Base64 (SOLO para tests) ---
# Clave: "test-secret-key-for-junit-tests-12345" en Base64
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci1qdW5pdC10ZXN0cy0xMjM0NQ==
jwt.expiration=3600000
jwt.refresh-expiration=86400000

# --- Silenciamos logs innecesarios en la salida de tests ---
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.com.vvu981=INFO

# --- Mail (valores stub para tests: el bean existe pero nunca envía correos reales) ---
# EmailService está @MockBean en los tests de controlador, y @Mock en los unitarios.
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
app.mail.from=noreply@colivi.com
app.mail.reactivation-subject=Reactiva tu cuenta en Colivi
app.mail.reactivation-url=http://localhost:3000/reactivate?token=
app.mail.booking-accepted-subject=¡Tu reserva ha sido aceptada!
app.mail.booking-rejected-subject=Actualización sobre tu solicitud de reserva
app.mail.password-reset-subject=Recupera tu contraseña en Colivi
app.mail.password-reset-url=http://localhost:3000/reset-password?token=
# --- Cloudinary (valores stub) ---
app.cloudinary.cloud-name=test-cloud
app.cloudinary.api-key=test-key
app.cloudinary.api-secret=test-secret
