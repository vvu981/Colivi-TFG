spring.application.name=Colivi-backend

# ─── Datasource (PostgreSQL) ─────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tfg_db?stringtype=unspecified}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tfg_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tfg_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# Flyway es el dueño del esquema: Hibernate solo valida, nunca genera DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
# 86400000 ms = 24 horas para el token normal
jwt.expiration=86400000
# 604800000 ms = 7 días para el refresh token
jwt.refresh-expiration=604800000
# Una clave secreta MUY larga (mínimo 256 bits)
jwt.secret=${JWT_SECRET:RXN0YUVzVW5hQ2xhdmVTZWNyZXRhTXV5TGFyZ2FZQ29tcGxlamFQYXJhRWxURkdEZVZpY3RvclZhbGxlam9Db2xpdikyMDI0}

# ─── Mail (SMTP) ──────────────────────────────────────────────────────────────
# En local apunta a Mailpit (no envía correos reales).
# En producción, sobreescribir con las variables de entorno del servidor.
# UI de inspección local: http://localhost:8025
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS_ENABLE:false}

# ─── Configuración de correos de aplicación ───────────────────────────────────
# Remitente que verá el destinatario en el campo "De:"
app.mail.from=${MAIL_FROM:noreply@colivi.com}
# Asunto del correo de reactivación de cuenta
app.mail.reactivation-subject=Reactiva tu cuenta en Colivi
# URL base del frontend para el enlace de reactivación
app.mail.reactivation-url=${MAIL_REACTIVATION_URL:http://localhost:5173/reactivate?token=}
# Asuntos del correo de reservas
app.mail.booking-accepted-subject=¡Tu reserva ha sido aceptada!
app.mail.booking-rejected-subject=Actualización sobre tu solicitud de reserva
# Correo de recuperación de contraseña
app.mail.password-reset-subject=Recupera tu contraseña en Colivi
app.mail.password-reset-url=${MAIL_PASSWORD_RESET_URL:http://localhost:5173/reset-password?token=}
# URL de solicitudes recibidas para enlaces en correos de notificación
app.mail.received-requests-url=${MAIL_RECEIVED_REQUESTS_URL:http://localhost:5173/received-requests?requestId=}

# ─── Configuracion de CLOUD STORAGE
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ─── Logging ─────────────────────────────────────────────────────────────────
# ─── Logging ─────────────────────────────────────────────────────────────────
logging.level.org.springframework.security=DEBUG

# ─── Google Auth ─────────────────────────────────────────────────────────────
app.google.client-id=${GOOGLE_CLIENT_ID:107294184753-qo7cnr52fmvavskavnhugpekb2nsge6n.apps.googleusercontent.com}

# ─── Spring AI & Model Orchestrator (MCP) ────────────────────────────────────
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${AI_API_KEY:${GROQ_API_KEY:gsk-placeholder-key-for-initialization}}
spring.ai.openai.chat.options.model=${AI_MODEL:${GROQ_MODEL:qwen/qwen3.8-27b}}
spring.ai.openai.chat.options.temperature=0.2
app.mcp.url=${MCP_SERVER_URL:http://localhost:3001}
