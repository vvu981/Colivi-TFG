spring.application.name=Colivi-backend

# ─── Datasource (PostgreSQL) ─────────────────────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tfg_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:tfg_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:tfg_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ─────────────────────────────────────────────────────────
# Flyway es el dueño del esquema: Hibernate solo valida, nunca genera DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ─── Flyway ──────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.out-of-order=false

# ─── JWT ─────────────────────────────────────────────────────────────────────
# 86400000 ms = 24 horas para el token normal
jwt.expiration=86400000
# 604800000 ms = 7 días para el refresh token
jwt.refresh-expiration=604800000
# Una clave secreta MUY larga (mínimo 256 bits)
jwt.secret=${JWT_SECRET:EstaEsUnaClaveSecretaMuyLargaYComplejaParaElTFGDeVictorVallejoColivi2024}