name: CI — Frontend Test & Coverage Gate

on:
  push:
    branches: [ "main", "dev", "feat/**", "test/**", "fix/**" ]
  pull_request:
    branches: [ "main", "dev", "feat/**", "test/**", "fix/**" ]

jobs:
  test-frontend:
    name: Build & Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Colivi-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./Colivi-frontend
        run: npm ci

      - name: Run tests (Unit & Integration)
        working-directory: ./Colivi-frontend
        run: npm run test:run

      - name: Build frontend
        working-directory: ./Colivi-frontend
        run: npm run build
